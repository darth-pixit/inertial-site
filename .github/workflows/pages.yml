# Publishes main to the gh-pages branch, which GitHub Pages serves
# (branch-based deployment — auto-enabled when gh-pages first appeared).
# This needs only contents:write, which the workflow token has by default;
# no Pages-admin API calls, so it can never hit "Resource not accessible
# by integration".
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-sync
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push site content to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-tmp
          rm -rf .github
          touch .nojekyll
          git add -A
          git commit -m "pages: publish ${GITHUB_SHA::7}"
          git push -f origin HEAD:gh-pages
